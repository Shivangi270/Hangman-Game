name: Build Hangman APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Step 1: Create a temporary package.json so npm and Capacitor can run
      - name: Initialize Dummy Node Project
        run: |
          npm init -y

      # Step 2: Install Capacitor core dependencies
      - name: Install Capacitor CLI & Platforms
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      # Step 3: Initialize Capacitor config pointing directly to your root directory
      - name: Initialize Capacitor Config
        run: |
          npx cap init GallowsPeak com.yourcompany.gallowspeak --web-dir=. --confirm --force

      # Step 4: Add the Android platform project folder
      - name: Add Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android directory already exists, skipping."
          fi

      # Step 5: Setup Android compilation environments
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 6: Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # Step 7: Sync the HTML/CSS/JS files into the Android project assets
      - name: Capacitor Sync
        run: |
          npx cap sync

      # Step 8: Build the actual debug APK file
      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      # Step 9: Make the final APK file available for download
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gallowspeak-hangman
          path: android/app/build/outputs/apk/debug/app-debug.apk
