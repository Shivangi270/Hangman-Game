name: Build Hangman APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Kept at 20 for project compatibility, environment forced below

      - name: Install Dependencies & Build Web Project
        run: |
          npm install
          # IF YOU HAVE A BUILD SCRIPT (e.g., Vite, React, Vue, Angular), UNCOMMENT THE LINE BELOW:
          # npm run build 

      - name: Install & Initialize Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          # Change '--web-dir=.' to your actual production build folder (e.g., dist, build, www)
          # If it's a plain HTML/JS game with index.html at root, leave it as '.' but ensure index.html exists.
          npx cap init GallowsPeak com.yourcompany.gallowspeak --web-dir=dist --web-dir-fallback=index.html --confirm
          npx cap add android || echo "Android folder may already exist, continuing..."

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Sync and Build APK
        run: |
          npx cap sync
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gallowspeak-hangman
          path: android/app/build/outputs/apk/debug/app-debug.apk
