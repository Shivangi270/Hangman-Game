name: Build Hangman APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 1. Automatically find your game's directory and create package.json there
      - name: Locate Project & Initialize Node
        id: locate
        run: |
          TARGET_DIR=$(dirname $(find . -name "index.html" -not -path '*/.*' | head -n 1))
          echo "Found game folder at: $TARGET_DIR"
          echo "project_dir=$TARGET_DIR" >> $GITHUB_OUTPUT
          cd "$TARGET_DIR"
          npm init -y

      # 2. Install Capacitor packages cleanly
      - name: Install Capacitor CLI & Platforms
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      # 3. FIXED: Removed '--confirm' to prevent the exit code 1 error
      - name: Initialize Capacitor Config
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          npx cap init GallowsPeak com.yourcompany.gallowspeak --web-dir=.

      # 4. Add Android Platform with directory guardrails
      - name: Add Android Platform
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android directory already exists, skipping."
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 5. Sync your HTML, CSS, and JS assets directly into native components
      - name: Capacitor Sync
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          npx cap sync

      # 6. Compile into a production-ready Debug APK package
      - name: Build Android APK
        run: |
          cd "${{ steps.locate.outputs.project_dir }}/android"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      # 7. Export the newly created APK for download
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gallowspeak-hangman
          path: ${{ github.workspace }}/**/android/app/build/outputs/apk/debug/app-debug.apk
