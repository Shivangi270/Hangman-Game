name: Build Hangman APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # This temporarily bypasses the forced Node 24 crash while keeping it secure
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install
          # If your app uses a framework (Vite/React), uncomment the line below:
          # npm run build 

      - name: Install and Setup Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          # Added --force to ensure initialization doesn't halt if a config file exists
          npx cap init GallowsPeak com.yourcompany.gallowspeak --web-dir=. --confirm --force
          
          # Checks if android folder exists before creating it to prevent process crashes
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync and Build APK
        run: |
          npx cap sync
          cd android
          chmod +x gradlew
          # Added --stacktrace to print the EXACT line error if compilation fails
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gallowspeak-hangman
          path: android/app/build/outputs/apk/debug/app-debug.apk
