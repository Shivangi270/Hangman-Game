name: Build Hangman APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Upgraded to v4 to natively use Node 24 and kill the warning
      - name: Checkout code
        uses: actions/checkout@v4
        
      # 2. Changed node-version to 24 to match GitHub's new environment standards
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Project Dependencies
        run: npm install

      - name: Install Capacitor CLI & Platforms
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      # 3. If this step fails, your repo doesn't have an index.html file at root.
      - name: Initialize Capacitor Config
        run: npx cap init GallowsPeak com.yourcompany.gallowspeak --web-dir=. --confirm --force

      # 4. Isolated this step. If it fails, the 'android' folder already exists in your GitHub repo.
      - name: Add Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android directory already exists, skipping addition."
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Capacitor Sync
        run: npx cap sync

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gallowspeak-hangman
          path: android/app/build/outputs/apk/debug/app-debug.apk
