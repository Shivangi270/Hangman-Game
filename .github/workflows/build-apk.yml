name: Build Hangman APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 1. Locate your game files and set up the clean directory structure
      - name: Locate Project & Initialize Structure
        id: locate
        run: |
          TARGET_DIR=$(dirname $(find . -name "index.html" -not -path '*/.*' | head -n 1))
          echo "Found game folder at: $TARGET_DIR"
          echo "project_dir=$TARGET_DIR" >> $GITHUB_OUTPUT
          cd "$TARGET_DIR"
          
          # Initialize the dummy package file
          npm init -y
          
          # Create a clean asset distribution folder to bypass the webDir rule
          mkdir -p www
          
          # Safely copy your asset folders and entry file into the new distribution folder
          cp -r index.html css scripts images audios www/ 2>/dev/null || true

      # 2. Install Capacitor core files
      - name: Install Capacitor CLI & Platforms
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      # 3. Initialize Capacitor Config pointing to www folder
      - name: Initialize Capacitor Config
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          npx cap init GallowsPeak com.yourcompany.gallowspeak --web-dir=www

      # 4. Add Android Platform
      - name: Add Android Platform
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android directory already exists, skipping."
          fi

      # 5. Setup Java 17 (standard for Android builds)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 6. Sync your web directory assets into the native mapped project
      - name: Capacitor Sync
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          npx cap sync

      # 7. Compile into a production-ready Debug APK package
      - name: Build Android APK
        run: |
          cd "${{ steps.locate.outputs.project_dir }}/android"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      # 8. Export the finished APK download
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gallowspeak-hangman
          path: ${{ github.workspace }}/**/android/app/build/outputs/apk/debug/app-debug.apk
